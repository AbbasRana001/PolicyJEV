[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policyjev"
version = "0.1.0"
description = "PolicyJEV: typed probabilistic moderation case study (TypeSafe JEV vs supervised baselines)"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Muhammad Abbas Rana" }]

[project.optional-dependencies]
api = ["fastapi>=0.143", "uvicorn>=0.54", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
